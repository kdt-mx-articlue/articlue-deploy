name: deploy

# 서버에 최신 이미지를 받아 다시 띄운다. 이미지는 각 서비스 repo 의 docker-image 워크플로가 빌드·push 한다.
#   - 서비스 repo main 병합 → 이미지 push → repository_dispatch(deploy) → 이 워크플로
#   - 이 repo main 에 compose·스크립트 변경이 병합되면 바로 배포
#   - 수동 실행: Actions → deploy → Run workflow (이미지 태그 지정 시 롤백)
# 서버는 서비스 소스 없이 이미지만 사용. 서브모듈 포인터는 그 이미지 :SHA 와 같은 커밋으로 맞춰 둔다
on:
  push:
    branches: [main]
    paths:
      - docker-compose.yml
      - scripts/**
      - .github/workflows/deploy.yml
  repository_dispatch:
    types: [deploy]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "배포할 이미지 태그 (비우면 portfolio = 각 서비스 main 최신, 롤백은 커밋 SHA)"
        type: string
        default: ""

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # 서버 준비 전에는 Repository variables 에 DEPLOY_ENABLED=true 를 넣지 않으면 실행하지 않음
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: 요청 정보
        run: |
          echo "event: ${{ github.event_name }}"
          echo "service: ${{ github.event.client_payload.service || '-' }} @ ${{ github.event.client_payload.sha || '-' }}"
          echo "image_tag: ${{ inputs.image_tag || 'portfolio' }}"

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts

      - name: Deploy
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '~/articlue' }}
          REGISTRY: ${{ vars.IMAGE_REGISTRY || 'docker.io/scv3114' }}
          IMAGE_TAG: ${{ inputs.image_tag || 'portfolio' }}
        run: |
          SSH="ssh -i ~/.ssh/id_deploy -p $PORT $USER@$HOST"
          $SSH "cd $DEPLOY_PATH && IMAGE_REGISTRY=$REGISTRY IMAGE_TAG=$IMAGE_TAG ./scripts/deploy.sh"
